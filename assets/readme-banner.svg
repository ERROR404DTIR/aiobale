<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">AioBale</title><desc id="d">An asynchronous messaging client represented by concurrent event streams.</desc><defs><linearGradient id="bg"><stop stop-color="#172a40"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g stroke="#62e3c1" stroke-width="3" fill="none"><path d="M110 100H1090M110 150H1090M110 200H1090" stroke-dasharray="10 12"><animate attributeName="stroke-dashoffset" values="0;-88" dur="3s" repeatCount="indefinite"/></path></g><g fill="#142c43" stroke="#8fa8ff" stroke-width="2"><rect x="130" y="72" width="170" height="55" rx="10"/><rect x="515" y="122" width="170" height="55" rx="10"/><rect x="900" y="172" width="170" height="55" rx="10"/></g><g fill="#edf3ff" font-family="monospace" font-size="15" text-anchor="middle"><text x="215" y="106">EVENT LOOP</text><text x="600" y="156">ASYNC CLIENT</text><text x="985" y="206">MESSAGES</text></g><circle r="7" fill="#62e3c1"><animateMotion dur="3s" repeatCount="indefinite" path="M300 100H515V150H900V200"/></circle><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">AIOBALE</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">ASYNC / EVENTS / MESSAGING</text></svg>